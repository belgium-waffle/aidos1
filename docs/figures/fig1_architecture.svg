<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .lane { fill: #f6f6f4; stroke: #9a9a9a; stroke-width: 1.2; }
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.2; }
      .acc { fill: #e8eef8; stroke: #2f5597; stroke-width: 1.4; }
      .dec { fill: #ffffff; stroke: #2f5597; stroke-width: 1.2; }
      .cli { fill: #ffffff; stroke: #333; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .ln { stroke: #333; stroke-width: 1.3; fill: none; }
      .t { font-size: 13px; font-weight: 700; fill: #111; }
      .s { font-size: 11px; fill: #333; }
      .lab { font-size: 13px; font-weight: 700; fill: #555; letter-spacing: 0.3px; }
      .el { font-size: 10.5px; fill: #2f5597; font-style: italic; }
    </style>
  </defs>

  <!-- client -->
  <rect class="cli" x="440" y="10" width="420" height="34" rx="4"/>
  <text class="t" x="650" y="26" text-anchor="middle">Client: LLM.generate / vllm serve</text>
  <text class="s" x="650" y="39" text-anchor="middle">sees committed text only (an answer, or an abstention)</text>

  <!-- lanes -->
  <rect class="lane" x="20" y="60" width="330" height="485" rx="6"/>
  <text class="lab" x="36" y="82">WORKER (GPU): vLLM model runner</text>
  <rect class="lane" x="420" y="60" width="460" height="485" rx="6"/>
  <text class="lab" x="650" y="82" text-anchor="middle">ENGINE CORE (CPU): AidosScheduler</text>

  <!-- worker column -->
  <rect class="box" x="45" y="100" width="280" height="56" rx="4"/>
  <text class="t" x="185" y="123" text-anchor="middle">Forward pass (unchanged)</text>
  <text class="s" x="185" y="141" text-anchor="middle">torch.compile and CUDA graphs untouched</text>

  <rect class="box" x="45" y="190" width="280" height="56" rx="4"/>
  <text class="t" x="185" y="213" text-anchor="middle">Hidden states at probe layers</text>
  <text class="s" x="185" y="231" text-anchor="middle">reuses the EAGLE-3 auxiliary outputs</text>

  <rect class="acc" x="45" y="280" width="280" height="56" rx="4"/>
  <text class="t" x="185" y="303" text-anchor="middle">Fused Triton kernel</text>
  <text class="s" x="185" y="321" text-anchor="middle">one gather–GEMV: up to 8 linear heads, fp32</text>

  <rect class="box" x="45" y="370" width="280" height="56" rx="4"/>
  <text class="t" x="185" y="393" text-anchor="middle">Scores, copied asynchronously</text>
  <text class="s" x="185" y="411" text-anchor="middle">ready at the existing sampled-token sync</text>

  <rect class="box" x="45" y="460" width="280" height="56" rx="4"/>
  <text class="t" x="185" y="483" text-anchor="middle">Apply directives</text>
  <text class="s" x="185" y="501" text-anchor="middle">truncate (rollback) · token bans · insert evidence</text>

  <line class="ln" x1="185" y1="156" x2="185" y2="188" marker-end="url(#a)"/>
  <line class="ln" x1="185" y1="246" x2="185" y2="278" marker-end="url(#a)"/>
  <line class="ln" x1="185" y1="336" x2="185" y2="368" marker-end="url(#a)"/>

  <!-- side channel arrows between lanes -->
  <line class="ln" x1="325" y1="398" x2="438" y2="398" marker-end="url(#a)"/>
  <text class="el" x="381" y="390" text-anchor="middle">scores on the</text>
  <text class="el" x="381" y="414" text-anchor="middle">runner output</text>
  <line class="ln" x1="440" y1="488" x2="327" y2="488" marker-end="url(#a)"/>
  <text class="el" x="383" y="480" text-anchor="middle">directives on the</text>
  <text class="el" x="383" y="504" text-anchor="middle">scheduler output</text>

  <!-- decisions row -->
  <rect class="dec" x="440" y="100" width="98" height="66" rx="4"/>
  <text class="t" x="489" y="120" text-anchor="middle">Answer</text>
  <text class="s" x="489" y="137" text-anchor="middle">release text behind</text>
  <text class="s" x="489" y="151" text-anchor="middle">commit horizon h</text>

  <rect class="dec" x="547" y="100" width="98" height="66" rx="4"/>
  <text class="t" x="596" y="120" text-anchor="middle">Retrieve</text>
  <text class="s" x="596" y="137" text-anchor="middle">pause; keeps KV</text>
  <text class="s" x="596" y="151" text-anchor="middle">blocks and its slot</text>

  <rect class="dec" x="654" y="100" width="98" height="66" rx="4"/>
  <text class="t" x="703" y="120" text-anchor="middle">Roll back</text>
  <text class="s" x="703" y="137" text-anchor="middle">rewind counter,</text>
  <text class="s" x="703" y="151" text-anchor="middle">evict prefix cache</text>

  <rect class="dec" x="761" y="100" width="98" height="66" rx="4"/>
  <text class="t" x="810" y="120" text-anchor="middle">Abstain</text>
  <text class="s" x="810" y="137" text-anchor="middle">finish with</text>
  <text class="s" x="810" y="151" text-anchor="middle">aidos_abstain</text>

  <line class="ln" x1="489" y1="100" x2="489" y2="46" marker-end="url(#a)"/>
  <line class="ln" x1="810" y1="100" x2="810" y2="46" marker-end="url(#a)"/>

  <!-- policy -->
  <rect class="acc" x="440" y="280" width="212" height="70" rx="4"/>
  <text class="t" x="546" y="301" text-anchor="middle">Policy: max expected utility</text>
  <text class="s" x="546" y="319" text-anchor="middle">+1 correct · −λ wrong · 0 abstain</text>
  <text class="s" x="546" y="335" text-anchor="middle">−c per retrieval (λ set by the user)</text>
  <line class="ln" x1="500" y1="280" x2="489" y2="168" marker-end="url(#a)"/>
  <line class="ln" x1="535" y1="280" x2="596" y2="168" marker-end="url(#a)"/>
  <line class="ln" x1="570" y1="280" x2="703" y2="168" marker-end="url(#a)"/>
  <line class="ln" x1="605" y1="280" x2="810" y2="168" marker-end="url(#a)"/>

  <!-- update_from_output -->
  <rect class="box" x="440" y="370" width="212" height="56" rx="4"/>
  <text class="t" x="546" y="393" text-anchor="middle">update_from_output</text>
  <text class="s" x="546" y="411" text-anchor="middle">per-request risk trace</text>
  <line class="ln" x1="546" y1="370" x2="546" y2="352" marker-end="url(#a)"/>

  <!-- schedule -->
  <rect class="box" x="440" y="460" width="212" height="56" rx="4"/>
  <text class="t" x="546" y="483" text-anchor="middle">schedule()</text>
  <text class="s" x="546" y="501" text-anchor="middle">resumed request prefills only the evidence</text>

  <!-- retrieval thread -->
  <rect class="acc" x="672" y="282" width="188" height="62" rx="4"/>
  <text class="t" x="766" y="304" text-anchor="middle">Retrieval threads</text>
  <text class="s" x="766" y="321" text-anchor="middle">batched BM25, or your retriever</text>
  <text class="s" x="766" y="335" text-anchor="middle">(the batch keeps decoding)</text>
  <line class="ln" x1="652" y1="313" x2="670" y2="313" marker-end="url(#a)"/>

  <!-- evidence path to schedule -->
  <path class="ln" d="M860,313 L870,313 L870,488 L654,488" marker-end="url(#a)"/>
  <text class="el" x="762" y="480" text-anchor="middle">evidence as chat-template tokens</text>

  <!-- observability -->
  <rect class="box" x="672" y="370" width="150" height="56" rx="4"/>
  <text class="t" x="747" y="393" text-anchor="middle">Status + telemetry</text>
  <text class="s" x="747" y="411" text-anchor="middle">→ aidos live (browser)</text>
  <line class="ln" x1="652" y1="398" x2="670" y2="398" marker-end="url(#a)"/>
</svg>
