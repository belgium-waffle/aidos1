name: tests
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU-only; vLLM contract tests and the Triton kernel test skip without vLLM / CUDA)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy transformers pytest bm25s PyStemmer
          pip install -e aidos-vllm --no-deps
      - name: Unit tests
        run: pytest aidos-vllm/tests -q -rs
